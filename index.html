<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة أسعار نزيه العطار</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* التنسيقات الأساسية */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: right;
            padding: 0;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        /* الهيدر (رأس الصفحة) */
        header {
            background-color: #A52A2A; /* لون بني مميز */
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .logo-container {
            display: flex;
            align-items: center;
        }
        .logo-container img {
            height: 50px; /* حجم اللوجو */
            margin-left: 15px;
            border-radius: 50%;
            border: 2px solid white;
        }
        header h1 {
            margin: 0;
            font-size: 1.8em;
        }

        /* حاوية الأزرار في الهيدر */
        .header-buttons {
            display: flex;
            gap: 10px;
        }
        .header-buttons a, .header-buttons button {
            text-decoration: none;
            color: white;
            background-color: #D2B48C; /* لون أفتح للأزرار */
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .header-buttons a:hover, .header-buttons button:hover {
            background-color: #fff;
            color: #A52A2A;
        }

        /* تنسيق أقسام المنيو */
        .main-content {
            padding: 20px;
        }
        .category-container {
            max-width: 850px;
            margin: 0 auto 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #A52A2A;
            border-bottom: 2px solid #D2B48C;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dotted #e0e0e0;
        }
        .menu-item:last-of-type {
            border-bottom: none;
        }
        .item-name {
            font-weight: 600;
            color: #333;
            flex-grow: 1;
            font-size: 1.1em;
        }
        .item-price {
            color: #008000;
            font-weight: bold;
            font-size: 1.1em;
            padding-right: 15px;
        }
        
        /* زر عرض المزيد */
        .toggle-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #D2B48C;
            color: #A52A2A;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .toggle-btn:hover {
            background-color: #A52A2A;
            color: white;
        }

        /* إخفاء العناصر الزائدة مبدئياً */
        .hidden-item {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="https://via.placeholder.com/50/A52A2A/FFFFFF?text=Logo" alt="شعار المتجر">
            <h1>قائمة أسعار نزيه العطار</h1>
        </div>
        
        <div class="header-buttons">
            <a href="URL_لصفحة_من_نحن" target="_blank">اعرف عنا</a>

            <a href="tel:+201000000000"><i class="fas fa-phone"></i> اتصال</a>

            <a href="https://wa.me/+201000000000" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>
        </div>
    </header>

    <div class="main-content">
        <div id="menu-container">
            <p style="text-align:center;">جاري تحميل الأسعار...</p>
        </div>

        <div class="category-container" style="text-align:center; margin-top: 50px;">
            <h2>تابعنا وتواصل معنا</h2>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <a href="URL_لصفحة_فيسبوك" target="_blank" style="font-size: 2em; color: #1877F2;"><i class="fab fa-facebook-square"></i></a>
                <a href="URL_لصفحة_انستجرام" target="_blank" style="font-size: 2em; color: #E4405F;"><i class="fab fa-instagram-square"></i></a>
                <a href="URL_لقناة_تليجرام" target="_blank" style="font-size: 2em; color: #0088CC;"><i class="fab fa-telegram"></i></a>
                <a href="URL_للموقع_الالكتروني" target="_blank" style="font-size: 2em; color: #666;"><i class="fas fa-globe"></i></a>
                <a href="URL_لخريطة_جوجل_موقع_المتجر" target="_blank" style="font-size: 2em; color: #db4437;"><i class="fas fa-map-marker-alt"></i></a>
            </div>
        </div>
    </div>
    
    <script>
        // رابط الـ CSV الذي أرسلته (سليم)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgbYRoL8GGwdIFjwzWvtNh43_ylOoYDRCst4i-pJUjPOwT813rVkCCGeoYFKfSPnXcHBAb094Z1SF8/pub?gid=1174703353&single=true&output=csv';
        const ITEMS_TO_SHOW = 5; // عدد الأصناف المبدئي للعرض قبل "عرض المزيد"

        function toggleItems(button, categoryId) {
            const container = document.getElementById(categoryId);
            const hiddenItems = container.querySelectorAll('.hidden-item');
            
            if (button.innerText.includes('عرض المزيد')) {
                hiddenItems.forEach(item => item.style.display = 'flex');
                button.innerText = 'عرض الأقل';
            } else {
                hiddenItems.forEach(item => item.style.display = 'none');
                button.innerText = `عرض المزيد (${hiddenItems.length} صنف إضافي)`;
            }
        }

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '<p style="text-align:center;">جاري تحميل الأسعار...</p>';
            
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                const data = rows.slice(1);
                
                const categories = {};
                data.forEach(row => {
                    if (row.length >= 3) {
                        const [category, item, price] = row;
                        if (category && item && price) {
                            if (!categories[category]) {
                                categories[category] = [];
                            }
                            categories[category].push({ item, price });
                        }
                    }
                });

                let menuHTML = '';
                
                for (const category in categories) {
                    const items = categories[category];
                    // إنشاء معرّف فريد لكل قسم
                    const categoryId = 'cat-' + category.replace(/\s/g, '_'); 

                    menuHTML += `<div class="category-container">`;
                    menuHTML += `<h2>${category}</h2>`;
                    menuHTML += `<div id="${categoryId}">`;
                    
                    items.forEach((dish, index) => {
                        const isHidden = index >= ITEMS_TO_SHOW;
                        const displayClass = isHidden ? 'hidden-item' : '';
                        
                        menuHTML += `
                            <div class="menu-item ${displayClass}">
                                <span class="item-name">${dish.item}</span>
                                <span class="item-price">${dish.price} ج.م</span>
                            </div>
                        `;
                    });
                    
                    menuHTML += `</div>`; // إغلاق div الـ id

                    // إضافة زر العرض/الإخفاء إذا كان عدد الأصناف أكبر من الحد المسموح به
                    if (items.length > ITEMS_TO_SHOW) {
                        const hiddenCount = items.length - ITEMS_TO_SHOW;
                        menuHTML += `
                            <button class="toggle-btn" onclick="toggleItems(this, '${categoryId}')">
                                عرض المزيد (${hiddenCount} صنف إضافي)
                            </button>
                        `;
                    }
                    
                    menuHTML += `</div>`; // إغلاق category-container
                }

                if (menuHTML === '') {
                    container.innerHTML = '<p style="color:blue; text-align:center;">القائمة فارغة أو صيغة الأعمدة غير صحيحة. يرجى التأكد من أن الترتيب في جوجل شيتس هو: **التصنيف** ثم **الصنف** ثم **السعر**.</p>';
                } else {
                    container.innerHTML = menuHTML;
                }
                
            } catch (error) {
                console.error('حدث خطأ أثناء جلب أو تحليل البيانات:', error);
                container.innerHTML = '<p style="color:red; text-align:center;">عفواً! لم يتمكن النظام من تحميل قائمة الأسعار. (تأكد من أن الرابط صحيح وتم نشره بصيغة CSV)</p>';
            }
        }

        loadMenu();

    </script>
</body>
</html>

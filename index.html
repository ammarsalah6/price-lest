<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazih El_Attar Price List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* التنسيقات الأساسية */
        body {
            font-family:'Times New Roman', Times, serif;
            text-align: right;
            padding: 0;
            margin: 0;
            background-color: #ddfbe5;
            color: #333;
        }

        
        header {
            background-color: #24700d; 
            color: white;
            padding: 15px 20px; 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: sticky; 
            top: 0;
            z-index: 1000;
        }
        
        .logo-container {
            grid-column: 2 / 3; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        .logo-container img {
            height: 120px; 
            margin-bottom: 5px; 
            border-radius: 50%;
            border: 2px solid #edce20;
            margin-left: 0; 
        }
        header h1 {
            margin: 0; 
            font-size: 35px;
            color: blanchedalmond;
        }

        .header-buttons {
            grid-column: 1 / 2; 
            display: flex;
            gap: 10px;
            justify-self: start; 
        }
        
        /* تنسيقات الأزرار */
        .header-buttons a, .header-buttons button {
            text-decoration: none;
            color: white;
            background-color: #0a3a04; 
            border: none;
            padding: 20px 35px;
            border-radius: 10px 0px 10px 0px;
            font-size: 30px;
            font-weight: bold; 
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .header-buttons a:hover, .header-buttons button:hover {
            background-color: #478d05;
            color: #0b0b0b;
        }

        /* تنسيق أقسام المنيو */
        .main-content {
            padding: 20px;
        }
        .category-container {
            max-width: 850px;
            margin: 0 auto 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #126104;
            border-bottom: 2px solid #075706;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dotted #e0e0e0;
        }
        .menu-item:last-of-type {
            border-bottom: none;
        }
        .item-name {
            font-weight: 600;
            color: #333;
            flex-grow: 1;
            font-size: 1.1em;
        }
        .item-price {
            color: #008000;
            font-weight: bold;
            font-size: 1.1em;
            padding-right: 15px;
        }
        
        /* زر عرض المزيد */
        .toggle-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2edf24;
            color: #ebebebdf;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            font-size: 20px; /* تم تعديل حجم الخط */
        }
        .toggle-btn:hover {
            background-color: #126104;
            color: white;
        }

        /* إخفاء العناصر الزائدة مبدئياً */
        .hidden-item {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-buttons">
            <a href="tel:+201227201188"><i class="fas fa-phone"></i> اتصال</a>
            <a href="https://wa.me/+201227201188" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>
        </div>
        
        <div class="logo-container">
            <img src="logo.png" alt="شعار المتجر">
            <h1>نـــزيـه الـعـطــار</h1>
        </div>
        
        <div></div>
    </header>

    <div class="main-content">
        <div id="menu-container">
            <p style="text-align:center;">جاري تحميل الأسعار...</p>
        </div>

        <div class="category-container" style="text-align:center; margin-top: 50px;">
            <h2>تابعنا وتواصل معنا</h2>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <a href="https://www.facebook.com/share/16RQhUBg3B/" target="_blank" style="font-size: 2em; color: #1877F2;"><i class="fab fa-facebook-square"></i></a>
                <a href="https://www.instagram.com/nazih_elataar?igsh=djc4MmhrNm1pdjhh" target="_blank" style="font-size: 2em; color: #ed647d;"><i class="fab fa-instagram-square"></i></a>
                <a href="https://t.me/+TDjFEhC9WXcxZjNk" target="_blank" style="font-size: 2em; color: #0088CC;"><i class="fab fa-telegram"></i></a>
                <a href="https://drive.google.com/file/d/1To0SO6tYQWtFeXcLzAuG2uOYXAM_Umz-/view?usp=drivesdk" target="_blank" style="font-size: 2em; color: #020202;"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.google.com/maps/dir/30.0580864,31.2508416/30.0578724,31.2508303/@30.0579794,31.2530264,17z/data=!3m1!4b1!4m4!4m3!1m1!4e1!1m0?entry=ttu&g_ep=EgoyMDI1MDYxMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" style="font-size: 2em; color: #db4437;"><i class="fas fa-map-marker-alt"></i></a>
            </div>
        </div>
    </div>
    
    <script>
        // رابط الـ CSV الذي أرسلته (سليم)
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgbYRoL8GGwdIFjwzWvtNh43_ylOoYDRCst4i-pJUjPOwT813rVkCCGeoYFKfSPnXcHBAb094Z1SF8/pub?gid=1174703353&single=true&output=csv';
        const ITEMS_TO_SHOW = 5; // عدد الأصناف المبدئي للعرض قبل "عرض المزيد"

        function toggleItems(button, categoryId) {
            const container = document.getElementById(categoryId);
            const hiddenItems = container.querySelectorAll('.hidden-item');
            
            if (button.innerText.includes('عرض المزيد')) {
                hiddenItems.forEach(item => item.style.display = 'flex');
                button.innerText = 'عرض الأقل';
            } else {
                hiddenItems.forEach(item => item.style.display = 'none');
                button.innerText = `عرض المزيد (${hiddenItems.length} صنف إضافي)`;
            }
        }

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '<p style="text-align:center;">جاري تحميل الأسعار...</p>';
            
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                const data = rows.slice(1);
                
                const categories = {};
                data.forEach(row => {
                    if (row.length >= 3) {
                        const [category, item, price] = row;
                        if (category && item && price) {
                            if (!categories[category]) {
                                categories[category] = [];
                            }
                            categories[category].push({ item, price });
                        }
                    }
                });

                let menuHTML = '';
                
                for (const category in categories) {
                    const items = categories[category];
                    // إنشاء معرّف فريد لكل قسم
                    const categoryId = 'cat-' + category.replace(/\s/g, '_'); 

                    menuHTML += `<div class="category-container">`;
                    menuHTML += `<h2>${category}</h2>`;
                    menuHTML += `<div id="${categoryId}">`;
                    
                    items.forEach((dish, index) => {
                        const isHidden = index >= ITEMS_TO_SHOW;
                        const displayClass = isHidden ? 'hidden-item' : '';
                        
                        menuHTML += `
                            <div class="menu-item ${displayClass}">
                                <span class="item-name">${dish.item}</span>
                                <span class="item-price">${dish.price} ج.م</span>
                            </div>
                        `;
                    });
                    
                    menuHTML += `</div>`; // إغلاق div الـ id

                    // إضافة زر العرض/الإخفاء إذا كان عدد الأصناف أكبر من الحد المسموح به
                    if (items.length > ITEMS_TO_SHOW) {
                        const hiddenCount = items.length - ITEMS_TO_SHOW;
                        menuHTML += `
                            <button class="toggle-btn" onclick="toggleItems(this, '${categoryId}')">
                                عرض المزيد (${hiddenCount} صنف إضافي)
                            </button>
                        `;
                    }
                    
                    menuHTML += `</div>`; // إغلاق category-container
                }

                if (menuHTML === '') {
                    container.innerHTML = '<p style="color:blue; text-align:center;">القائمة فارغة أو صيغة الأعمدة غير صحيحة. يرجى التأكد من أن الترتيب في جوجل شيتس هو: **التصنيف** ثم **الصنف** ثم **السعر**.</p>';
                } else {
                    container.innerHTML = menuHTML;
                }
                
            } catch (error) {
                console.error('حدث خطأ أثناء جلب أو تحليل البيانات:', error);
                container.innerHTML = '<p style="color:red; text-align:center;">عفواً! لم يتمكن النظام من تحميل قائمة الأسعار. (تأكد من أن الرابط صحيح وتم نشره بصيغة CSV)</p>';
            }
        }

        loadMenu();

    </script>
</body>
</html>

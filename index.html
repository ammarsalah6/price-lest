<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazih El_Attar price list</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* التنسيقات الأساسية */
        body {
            font-family:'Times New Roman', Times, serif;
            text-align: right;
            padding: 0;
            margin: 0;
            background-color: #ddfbe5;
            color: #333;
        }

        /* الهيدر (رأس الصفحة) */
        header {
            background-color: #24700d; 
            color: white;
            padding: 15px 20px; 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: sticky; 
            top: 0;
            z-index: 1000;
        }
        
        /* توسيط اللوجو داخل العمود الأوسط */
        .logo-container {
            grid-column: 2 / 3; 
            display: flex;
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        .logo-container img {
            height: 90px; 
            margin-bottom: 5px; 
            border-radius: 50%;
            border: 3px solid #ddf5c7;
            margin-left: 0; 
        }
        header h1 {
            margin: 0; 
            font-size: 1.6em;
        }

        /* حاوية الأزرار في الهيدر */
        .header-buttons {
            grid-column: 1 / 2; 
            display: flex;
            gap: 10px;
            justify-self: start; 
        }
        
        /* تنسيقات الأزرار */
        .header-buttons a, .header-buttons button {
            text-decoration: none;
            color: white;
            background-color: #0a3a04; 
            border: none;
            padding: 18px 30px; 
            border-radius: 15px;
            font-size: 1.2em; 
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .header-buttons a:hover, .header-buttons button:hover {
            background-color: #ddf5c7;
            color: #0b0b0b;
        }

        /* 💡 تنسيق مربع البحث الجديد */
        .search-container {
            max-width: 850px;
            margin: 20px auto;
            padding: 15px;
            background-color: #ffffff84;
            border-radius: 15px 0px 15px 0px ;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
        }
        #searchInput {
            width: 100%;
            padding: 10px;
            border: 2px solid #24700d;
            border-radius: 12px;
            font-size: 1.1em;
            text-align: right;
            outline: none;
            box-sizing: border-box;
            margin-left: 20px;
        }
        .search-icon {
            color: #24700d;
            font-size: 1.5em;
            margin-left: 15px;
        }

        /* تنسيق أقسام المنيو */
        .main-content {
            padding: 20px;
        }
        .category-container {
            max-width: 850px;
            margin: 0 auto 30px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px 0px 15px 0px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #126104;
            border-bottom: 2px solid #075706;
            padding-bottom: 8px;
            margin-top: 0;
            font-size: 1.8em;
            margin-bottom: 20px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dotted #e0e0e0;
        }
        .menu-item:last-of-type {
            border-bottom: none;
        }
        .item-name {
            font-weight: 600;
            color: #333;
            flex-grow: 1;
            font-size: 1.5em;
        }
        .item-price {
            color: #008000;
            font-weight: bold;
            font-size: 1.5em;
            padding-right: 15px;
        }
        
        /* زر عرض المزيد */
        .toggle-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #2edf24;
            color: #ebebebdf;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            font-size: 25px;
        }
        .toggle-btn:hover {
            background-color: #126104;
            color: white;
        }

        /* 💡 التعديل هنا: نستخدم !important لضمان الإخفاء */
        .hidden-item {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-buttons">
            <a href="tel:+201227201188"><i class="fas fa-phone"></i> اتصال</a>
            <a href="https://wa.me/+201227201188" target="_blank"><i class="fab fa-whatsapp"></i> واتساب</a>
        </div>
        
        <div class="logo-container">
            <img src="logo.png" alt="شعار المتجر">
            <h1>نزيه العطار</h1>
        </div>
        
        <div></div>
    </header>

    <div class="main-content">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="ابحث باسم الصنف أو التصنيف..." onkeyup="filterMenu()">
        </div>

        <div id="menu-container">
            <p style="text-align:center;">جاري تحميل الأسعار...</p>
        </div>

        <div class="category-container" style="text-align:center; margin-top: 50px;">
            <h2>تابعنا وتواصل معنا</h2>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <a href="https://www.facebook.com/share/16RQhUBg3B/" target="_blank" style="font-size: 2em; color: #1877F2;"><i class="fab fa-facebook-square"></i></a>
                <a href="https://www.instagram.com/nazih_elataar?igsh=djc4MmhrNm1pdjhh" target="_blank" style="font-size: 2em; color: #ed647d;"><i class="fab fa-instagram-square"></i></a>
                <a href="https://t.me/+TDjFEhC9WXcxZjNk" target="_blank" style="font-size: 2em; color: #0088CC;"><i class="fab fa-telegram"></i></a>
                <a href="https://drive.google.com/file/d/1To0SO6tYQWtFeXcLzAuG2uOYXAM_Umz-/view?usp=drivesdk" target="_blank" style="font-size: 2em; color: #020202;"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.google.com/maps/dir/30.0580864,31.2508416/30.0578724,31.2508303/@30.0579794,31.2530264,17z/data=!3m1!4b1!4m4!4m3!1m1!4e1!1m0?entry=ttu&g_ep=EgoyMDI1MDYxMS4wIKXMDSoASAFQAw%3D%3D" target="_blank" style="font-size: 2em; color: #db4437;"><i class="fas fa-map-marker-alt"></i></a>
            </div>
        </div>
    </div>
        <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgbYRoL8GGwdIFjwzWvtNh43_ylOoYDRCst4i-pJUjPOwT813rVkCCGeoYFKfSPnXcHBAb094Z1SF8/pub?gid=1174703353&single=true&output=csv';
        const ITEMS_TO_SHOW = 5; 

        // 💡 الدالة المصححة لـ "عرض المزيد/عرض الأقل"
        function toggleItems(button, categoryId) {
            const container = document.getElementById(categoryId);
            // البحث عن كل الأصناف داخل القسم
            const allItems = container.querySelectorAll('.menu-item');
            
            // حساب عدد العناصر المخفية في الحالة الأساسية
            const totalHiddenCount = allItems.length - ITEMS_TO_SHOW;

            // إذا كان النص الحالي هو "عرض المزيد"
            if (button.innerText.includes('عرض المزيد')) {
                // إظهار جميع العناصر بعد أول 5 (بإزالة الكلاس)
                allItems.forEach(item => item.classList.remove('hidden-item'));
                button.innerText = 'عرض الأقل';
            } else {
                // إخفاء العناصر الزائدة عن طريق إضافة الكلاس
                allItems.forEach((item, index) => {
                    // إذا كان مؤشر الصنف أكبر من أو يساوي 5 (الحد الأقصى للعرض)
                    if (index >= ITEMS_TO_SHOW) {
                         item.classList.add('hidden-item');
                    }
                });
                button.innerText = `عرض المزيد (${totalHiddenCount} صنف إضافي)`;
            }
            
            // 💡 ملاحظة: لا نحتاج لتشغيل filterMenu() هنا طالما أننا لا نعدل قيمة البحث.
            // ولكن سنعيدها لإعادة ضبط شريط البحث
            document.getElementById('searchInput').value = '';
            filterMenu(); 
        }

        // 💡 دالة البحث/الفلترة
        function filterMenu() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase(); 
            const categories = document.querySelectorAll('.category-container');

            categories.forEach(categoryContainer => {
                const categoryTitle = categoryContainer.querySelector('h2');
                const itemsDiv = categoryContainer.querySelector('[id^="cat-"]');
                const items = itemsDiv ? itemsDiv.querySelectorAll('.menu-item') : [];
                const toggleBtn = categoryContainer.querySelector('.toggle-btn');
                
                let categoryHasMatch = false;
                
                // 1. البحث في الأصناف
                items.forEach(item => {
                    const itemName = item.querySelector('.item-name').innerText.toLowerCase();
                    const itemCategory = categoryTitle.innerText.toLowerCase();

                    // شرط المطابقة: إما اسم الصنف يطابق أو التصنيف يطابق
                    if (itemName.includes(filter) || itemCategory.includes(filter)) {
                        item.style.display = 'flex'; // إظهار الصنف
                        categoryHasMatch = true;
                        // إزالة كلاس الإخفاء الخاص بـ 'عرض المزيد' لضمان الظهور أثناء البحث
                        item.classList.remove('hidden-item'); 
                    } else {
                        item.style.display = 'none'; // إخفاء الصنف
                    }
                });
                
                // 2. التعامل مع زر عرض المزيد/عرض الأقل (إخفائه أثناء البحث)
                if (toggleBtn) {
                    toggleBtn.style.display = 'none';
                }

                // 3. التعامل مع حاوية التصنيف بالكامل
                if (categoryHasMatch) {
                    categoryContainer.style.display = 'block'; 
                } else {
                    categoryContainer.style.display = 'none'; 
                }

                // 4. إذا كان مربع البحث فارغًا، نرجع القائمة لوضعها الطبيعي
                if (filter === '') {
                    categoryContainer.style.display = 'block'; 
                    if (toggleBtn) toggleBtn.style.display = 'block'; 
                    
                    items.forEach((item, index) => {
                        item.style.display = 'flex'; // إظهار الكل أولاً (إلغاء الإخفاء الناتج عن البحث)
                        
                        // ثم إعادة إضافة كلاس الإخفاء للعناصر الزائدة
                        if (index >= ITEMS_TO_SHOW) {
                             item.classList.add('hidden-item');
                        } else {
                             item.classList.remove('hidden-item');
                        }
                    });

                    // إعادة زر "عرض الأقل" لوضعه الأصلي (عرض المزيد)
                    if (toggleBtn && toggleBtn.innerText.includes('عرض الأقل')) {
                         const hiddenCount = items.length - ITEMS_TO_SHOW;
                         toggleBtn.innerText = `عرض المزيد (${hiddenCount} صنف إضافي)`;
                    }
                }
            });
        }

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '<p style="text-align:center;">جاري تحميل الأسعار...</p>';
            
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                const data = rows.slice(1);
                
                const categories = {};
                data.forEach(row => {
                    if (row.length >= 3) {
                        const [category, item, price] = row;
                        if (category && item && price) {
                            if (!categories[category]) {
                                categories[category] = [];
                            }
                            categories[category].push({ item, price });
                        }
                    }
                });

                let menuHTML = '';
                
                for (const category in categories) {
                    const items = categories[category];
                    const categoryId = 'cat-' + category.replace(/\s/g, '_'); 

                    menuHTML += `<div class="category-container">`;
                    menuHTML += `<h2>${category}</h2>`;
                    menuHTML += `<div id="${categoryId}">`;
                    
                    items.forEach((dish, index) => {
                        const isHidden = index >= ITEMS_TO_SHOW;
                        // 💡 التعديل هنا: نستخدم كلاس 'hidden-item' للإخفاء الأولي
                        const hiddenClass = isHidden ? 'hidden-item' : '';
                        
                        menuHTML += `
                            <div class="menu-item ${hiddenClass}">
                                <span class="item-name">${dish.item}</span>
                                <span class="item-price">${dish.price} ج.م</span>
                            </div>
                        `;
                    });
                    
                    menuHTML += `</div>`; 

                    if (items.length > ITEMS_TO_SHOW) {
                        const hiddenCount = items.length - ITEMS_TO_SHOW;
                        menuHTML += `
                            <button class="toggle-btn" onclick="toggleItems(this, '${categoryId}')">
                                عرض المزيد (${hiddenCount} صنف إضافي)
                            </button>
                        `;
                    }
                    
                    menuHTML += `</div>`; 
                }

                if (menuHTML === '') {
                    container.innerHTML = '<p style="color:blue; text-align:center;">القائمة فارغة أو صيغة الأعمدة غير صحيحة.</p>';
                } else {
                    container.innerHTML = menuHTML;
                }
                
            } catch (error) {
                console.error('حدث خطأ أثناء جلب أو تحليل البيانات:', error);
                container.innerHTML = '<p style="color:red; text-align:center;">عفواً! لم يتمكن النظام من تحميل قائمة الأسعار.</p>';
            }
        }

        loadMenu();

    </script>
</body>
</html>

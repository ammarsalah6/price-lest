<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مينيو الأسعار</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: right; /* محاذاة النص لليمين للغة العربية */
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .category-container {
            max-width: 800px;
            margin: 0 auto 40px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #A52A2A; /* لون بني للعنوان */
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
            margin-top: 0;
            font-size: 1.8em;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .item-name {
            font-weight: bold;
            color: #555;
            flex-grow: 1;
        }
        .item-price {
            color: #008000; /* لون أخضر للسعر */
            font-weight: bold;
            padding-right: 15px;
        }
    </style>
</head>
<body>

    <h1>قائمة أسعار نزيه العطار</h1>
    
    <div id="menu-container">
        <p style="text-align:center;">جاري تحميل الأسعار...</p>
    </div>

    <script>
        // 🚨 هام جداً: استبدل هذا الرابط برابط الـ CSV الذي نسخته في الخطوة 1
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgbYRoL8GGwdIFjwzWvtNh43_ylOoYDRCst4i-pJUjPOwT813rVkCCGeoYFKfSPnXcHBAb094Z1SF8/pub?gid=1174703353&single=true&output=csv';

        async function loadMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '<p style="text-align:center;">جاري تحميل الأسعار...</p>';
            
            try {
                // 1. جلب البيانات من رابط النشر (بصيغة CSV)
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();

                // 2. تحليل البيانات (تحويل CSV لنظام صفوف وأعمدة)
                // هذه الدالة البسيطة تفصل البيانات
                const rows = csvText.trim().split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')));
                
                // تخطي الصف الأول (عناوين الأعمدة)
                const data = rows.slice(1);

                // 3. تجميع البيانات حسب "التصنيف"
                const categories = {};
                data.forEach(row => {
                    const [category, item, price] = row;
                    if (!categories[category]) {
                        categories[category] = [];
                    }
                    categories[category].push({ item, price });
                });

                // 4. بناء هيكل HTML للمنيو
                let menuHTML = '';
                
                for (const category in categories) {
                    // بناء عنوان التصنيف
                    menuHTML += `<div class="category-container">`;
                    menuHTML += `<h2>${category}</h2>`;
                    
                    // بناء عناصر كل صنف داخل التصنيف
                    categories[category].forEach(dish => {
                        menuHTML += `
                            <div class="menu-item">
                                <span class="item-name">${dish.item}</span>
                                <span class="item-price">${dish.price} ج.م</span>
                            </div>
                        `;
                    });
                    
                    menuHTML += `</div>`;
                }

                container.innerHTML = menuHTML; // عرض المنيو بالكامل
                
            } catch (error) {
                console.error('حدث خطأ أثناء جلب أو تحليل البيانات:', error);
                container.innerHTML = '<p style="color:red; text-align:center;">عفواً! لم يتمكن النظام من تحميل قائمة الأسعار. (تأكد من نشر الرابط)</p>';
            }
        }

        // تشغيل الدالة بمجرد تحميل الصفحة
        loadMenu();

    </script>
</body>
</html>
